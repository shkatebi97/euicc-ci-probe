name: Build eUICC CI Probe APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Extract source ZIP
        run: python3 -m zipfile -e Euicc_CI_Probe_Android_Source.zip build-source

      - name: Check CI-list decoder
        working-directory: build-source/euicc-ci-probe
        run: bash tools/test_decoder.sh

      - name: Build debug APK
        working-directory: build-source/euicc-ci-probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Euicc-CI-Probe-APK
          path: build-source/euicc-ci-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
